<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Variables y estado</title>
  </head>

  <body>
    <h1>Formulario simple</h1>

    <form id="personForm">
      <div>
        <label for="dni">DNI</label>
        <input id="dni" type="text" placeholder="Ej: 12345678" />
      </div>

      <div>
        <label for="name">Nombre</label>
        <input id="name" type="text" placeholder="Ej: Ana" />
      </div>
      <div>
        <label for="lastname">Apellido</label>
        <input id="lastname" type="text" placeholder="Ej: Pérez" />
      </div>

      <button type="submit">Validar</button>
    </form>

    <p id="validationMessage">Estado: pendiente</p>

    <script src="./script_139.js"></script>
  </body>
</html>
